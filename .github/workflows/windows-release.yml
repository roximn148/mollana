# Windows release: build the installer, verify it, and publish the GitHub Release.
#
# Triggered by pushing a `v*` tag, or manually from the Actions tab. The release
# version always comes from pyproject.toml; the tag or the manual `version` input
# must agree with it, so the installer filename, the committed winget manifest,
# and the Release can never drift apart. The atomic release commit (version bump
# + dated CHANGELOG section + generated winget manifest) is the human step that
# makes these agree; see the release checklist in AGENTS.md.
name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; must match pyproject.toml. Defaults to pyproject.toml.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, verify, and publish
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Resolve the release version
        id: version
        shell: pwsh
        run: |
          $version = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event.inputs.version }}" -ne "") {
            if ($version -ne "${{ github.event.inputs.version }}") {
              throw "workflow input version '${{ github.event.inputs.version }}' does not match pyproject.toml ($version)"
            }
          } elseif ($tag -match "^v") {
            if ($version -ne $tag.Substring(1)) {
              throw "tag $tag does not match pyproject.toml ($version)"
            }
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run the test suite
        run: uv run pytest

      - name: Install Inno Setup
        # Pinned: the installer bytes depend on the Inno Setup version, and the
        # winget manifest's InstallerSha256 is generated with the pinned version.
        # --source winget keeps the msstore source out of it; without the
        # agreement flags winget stops at a Y/N prompt and the runner cannot
        # answer it.
        run: winget install -e --id JRSoftware.InnoSetup --version 6.7.3 --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity

      - name: Build the application and installer
        shell: pwsh
        run: |
          & "scripts\generate-win-setup.bat"
          if ($LASTEXITCODE -ne 0) { throw "generate-win-setup.bat failed" }

      - name: Record the built file hashes
        # Reproducibility debugging aid: the manifest check below compares one
        # sha256 for the whole installer, which says nothing about *what*
        # differs when a workstation and the runner disagree.
        shell: pwsh
        run: |
          Get-ChildItem dist\Mollana -Recurse -File | Sort-Object FullName | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "{0}  {1}" -f $h.Substring(0, 16), $_.FullName.Replace("$PWD\dist\Mollana\", "")
          }

      - name: Check the committed winget manifest
        run: uv run python scripts/winget_manifest.py --check

      - name: Validate the winget manifest schema
        # The committed manifests must stay schema-valid so the winget-pkgs
        # submission PR passes its validation pipeline untouched.
        run: winget validate --manifest "winget/RoXimn.Mollana/$($env:VERSION)"

      - name: Smoke test the frozen application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\Mollana\Mollana.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) { throw "Mollana.exe exited early with code $($process.ExitCode)" }
          if ($process.MainWindowHandle -eq 0) { throw "Mollana.exe has no main window after startup" }
          $process.Kill()
          $process.WaitForExit()
          Write-Host "smoke test passed"

      - name: Extract the release notes
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "## \[" + [regex]::Escape($env:VERSION) + "\] - \d{4}-\d{2}-\d{2}\r?\n([\s\S]*?)(?=\r?\n## \[)"
          if ($changelog -notmatch $pattern) { throw "no dated CHANGELOG section for version $($env:VERSION)" }
          $notes = $Matches[1].TrimEnd()
          if ($notes -eq "") { throw "CHANGELOG section for $($env:VERSION) is empty" }
          Set-Content release-notes.md -Value $notes -Encoding utf8

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$($env:VERSION)"
          $installer = "dist/Mollana-$($env:VERSION)-win64-setup.exe"
          if (gh release view $tag --json tagName > $null 2>&1) {
            gh release upload $tag $installer --clobber --notes-file release-notes.md
          } else {
            gh release create $tag $installer --title "Mollana $($env:VERSION)" --notes-file release-notes.md --target ${{ github.sha }}
          }
