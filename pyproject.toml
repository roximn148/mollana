[project]
name = "mollana"
version = "0.1.3"
license = "MIT"
license-files = ["LICENSE"]
description = "Urdu Roman-script transliterated Unicode text editor"
readme = "README.md"
authors = [
    { name = "RoXimn", email = "roximn148@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "confz>=2.1.0",
    "pydantic>=2.12.5",
    "pyside6>=6.10.1",
    "pyraya>=0.1.0a9",
    "romanalfaz>=0.1.0a10",
    "strenum>=0.4.15",
    "symspellpy>=6.9.0",
    "tomlkit>=0.13.3",
    "spacy>=3.8.14",
    "unicodedataplus>=16.0.0.post1",
    "selectolax>=0.4.8",
    "pylatexenc>=2.10",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mollana"
module-root = ""

[dependency-groups]
dev = [
    "pyinstaller>=6.17.0",
    "pyrefly>=1.4.0",
    "pytest>=9.0.2",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mollana"]

[tool.pyrefly]
project-includes = ["mollana"]
python-version = "3.14"
ignore-missing-imports = ["unicodedataplus"]
